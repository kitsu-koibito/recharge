<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge Your Energy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="images/battery.svg" type="image/svg+xml">
</head>
<body>
    <div class="sakura-container" id="sakura-container"></div>

    <div class="content">
        <h1>Time to <span class="highlight">Recharge</span></h1>
        <p class="message">Take a moment to recharge...</p>
        
        <div class="battery-container">
            <div class="battery">
                <div class="battery-level" id="battery-level"></div>
            </div>
            <div class="battery-cap"></div>
        </div>
        
        <div class="battery-status">
            <p id="battery-percentage">0%</p>
            <p id="battery-message">Tap to start charging</p>
        </div>
        
        <button id="recharge-btn">Recharge</button>
        
        <div id="reminder-container" class="reminder-container hidden">
            <img src="images/recharge.gif" alt="Recharge" class="recharge-gif">
            <div class="reminder-text">
                <p class="reminder-main">Don't forget to take care of yourself! ❤️</p>
                <p class="reminder-quote">To the world you're one person,<br>but to one person <strong>you're the whole world</strong>!</p>
            </div>
        </div>
    </div>

    <!-- <footer>
        <p>Made with 💖 just for you</p>
    </footer> -->
    
    <script src="script.js"></script>
</body>
</html>
